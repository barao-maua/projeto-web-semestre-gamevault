{% extends "base.html" %}
{% load static %}

{% block title %}Senha redefinida - GameVault{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
{% endblock %}

{% block content %}
<section class="screen auth-shell">
    <div class="section-heading">
        <p class="eyebrow">Acesso recuperado</p>
        <h2>Senha redefinida</h2>
        <p>Sua senha foi atualizada. Agora voce pode entrar com a nova senha.</p>
    </div>

    <div class="auth-footer">
        <p><a href="{% url 'core:login' %}" class="button">Ir para o login</a></p>
    </div>
</section>
{% endblock %}
